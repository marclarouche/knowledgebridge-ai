[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "knowledgebridge-ai"
version = "0.1.0"
description = "Local technical document ingestion and source-referenced passages"
requires-python = ">=3.12,<3.13"
dependencies = ["streamlit>=1.50,<2", "pydantic>=2.10,<3", "PyYAML>=6.0.2,<7", "python-docx>=1.2,<2", "PyMuPDF>=1.26,<2", "chromadb>=1.5,<2"]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.14,<2", "types-PyYAML", "pip-audit>=2.8,<3"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "app.py"]
[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*"]
ignore_missing_imports = true
[tool.uv]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]
